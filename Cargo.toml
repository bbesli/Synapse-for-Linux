[workspace]
resolver = "3"
members = ["crates/synapse-core", "crates/synapsectl", "crates/synapse-gui"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"
repository = "https://github.com/bbesli/Synapse-for-Linux"
homepage = "https://github.com/bbesli/Synapse-for-Linux"
authors = ["Burak Beşli <https://github.com/bbesli>"]

[workspace.dependencies]
synapse-core = { path = "crates/synapse-core" }
anyhow = "1"
thiserror = "2"
libc = "0.2"
log = "0.4"
env_logger = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
dirs = "6"
clap = { version = "4", features = ["derive"] }
eframe = "0.36"
egui = "0.36"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
notify-rust = "4"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
