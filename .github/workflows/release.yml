name: Release

# The maintainer publishes a release (so it shows their name); this workflow
# then builds the binaries and attaches them to it. Run it by hand to only
# build the archive as a workflow artifact.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 (glibc 2.35) so the binaries also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: scripts/package-release.sh
      - name: Check the archive
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar xzf synapse-linux-x86_64.tar.gz
          synapse-linux-x86_64/bin/synapsectl --version
          synapse-linux-x86_64/bin/synapsectl --simulate status
          synapse-linux-x86_64/bin/synapse-linux --version
          rm -rf synapse-linux-x86_64
      - uses: actions/upload-artifact@v7
        with:
          name: synapse-linux-x86_64
          path: dist/*
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber
