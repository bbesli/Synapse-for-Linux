name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Ubuntu 22.04 (glibc 2.35) so the binaries also run on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: scripts/package-release.sh
      - name: Check the archive
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          tar xzf synapse-linux-x86_64.tar.gz
          synapse-linux-x86_64/bin/synapsectl --version
          synapse-linux-x86_64/bin/synapsectl --simulate status
          synapse-linux-x86_64/bin/synapse-linux --version
          rm -rf synapse-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: synapse-linux-x86_64
          path: dist/*
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          notes="docs/release-notes/${tag}.md"
          [ -f "$notes" ] || notes=CHANGELOG.md
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "Synapse for Linux ${tag}" --notes-file "$notes"
          fi
